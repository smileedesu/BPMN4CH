<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="eGov Threat Modeling & Risk Analysis Platform">
    <meta name="author" content="Maria Maddalena Panico">
    <title>eGov · Risk Analysis</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

    <!-- jQuery & Bootstrap Bundle -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx"
            crossorigin="anonymous"></script>

    <!-- Bootstrap Select CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/css/bootstrap-select.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/js/bootstrap-select.min.js"></script>

    <!-- DataTables CSS & JS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.24/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.10.24/js/jquery.dataTables.min.js"></script>

    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        :root {
            --brand-primary: #0b5ed7;
            --brand-secondary: #6c757d;
            --brand-success: #198754;
            --brand-warning: #f59f00;
            --brand-danger: #d6333f;
            --brand-info: #0dcaf0;
            --muted: #6c757d;
        }

        html, body {
            width: 100% !important;
            max-width: 100% !important;
            overflow-x: hidden;
            font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #212529;
            background-color: #fcfcfd;
        }

        /* Layout fluido su tutte le pagine */
        .container, .container-fluid {
            width: 100% !important;
            max-width: 100% !important;
            padding-left: 2.5rem !important;
            padding-right: 2.5rem !important;
        }

        .starter-template {
            margin-top: 75px;
            width: 100% !important;
        }

        .card-icon { width:48px; height:48px; display:flex; align-items:center; justify-content:center; font-size:1.25rem; border-radius:8px; background: rgba(0,0,0,0.03); }
        .badge-pill { padding-top:0.45em; padding-bottom:0.45em; border-radius:999px; font-weight:600; }

        /* Risk badges */
        .badge-risk-high { background-color: var(--brand-danger); color: #fff; }
        .badge-risk-medium { background-color: var(--brand-warning); color: #212529; }
        .badge-risk-low { background-color: var(--brand-success); color: #fff; }
        .badge-risk-unknown { background-color: var(--brand-secondary); color: #fff; }

        /* Status badges */
        .badge-status-enriched { background-color: var(--brand-success); color: #fff; }
        .badge-status-missing { background-color: var(--brand-danger); color: #fff; }

        /* Generic type badge */
        .badge-type { background-color: var(--brand-info); color: #fff; }

        /* Icon helpers */
        .icon-threat { color: var(--brand-danger); }
        .icon-control { color: var(--brand-primary); }
        .icon-asset { color: var(--brand-info); }

        .badge-threat { background: #ffffff; border: 1px solid #dee2e6; color: #212529; }
        .card { border-radius: 8px; }
        .card .card-body h5, .card .card-body h6 { font-weight: 600; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top shadow-sm px-4">
    <a class="navbar-brand font-weight-bold" href="/" style="color: #3b82f6;">
        <i class="fas fa-shield-alt mr-2"></i>eGov · Risk Analysis
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarsExampleDefault"
            aria-controls="navbarsExampleDefault" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarsExampleDefault">
        <ul class="navbar-nav mr-auto">
            <li class="nav-item">
                <a class="nav-link font-weight-bold" href="/">
                    <i class="fas fa-server mr-1"></i> System Management
                </a>
            </li>
            {% if pk %}
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle font-weight-bold" href="#" id="navbarDropdown" role="button"
                       data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        <i class="fas fa-project-diagram mr-1"></i> Threat Modeling
                    </a>
                    <div class="dropdown-menu shadow border-0" aria-labelledby="navbarDropdown">
                        {% for process in processes %}
                        <a class="dropdown-item" href="{% url 'process_view_task_type' systemId=process.system_id processId=process.id %}">
                            {{ process.name }}
                        </a>
                    {% endfor %}
                    </div>
                </li>
            {% endif %}
        </ul>
    </div>
</nav>

<main role="main" class="container-fluid">
    <div class="starter-template">
        {% block content %}
        {% endblock %}
    </div>
</main>

</body>
</html>
